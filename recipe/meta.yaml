{% set name = "kwarray" %}
{% set version = "0.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/kwarray-{{ version }}.tar.gz
  sha256: 370c6830141a35114c899fa6f5ef2a3272ea704f679a83177b74c6d9fe8bf162

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=41.0.1
  run:
    - numpy
    - packaging >=21.3
    - python >={{ python_min }}
    - ubelt >=1.2.3

test:
  imports:
    - kwarray
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://gitlab.kitware.com/computer-vision/kwarray
  summary: The kwarray module
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Erotemic
    - vicentebolea
